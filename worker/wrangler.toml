name = "tetherscord"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Deploying the Worker separately from Pages.

[observability.logs]
enabled = true
invocation_logs = true


[vars]
DISCORD_CLIENT_ID = "1540421919982231692"

# DISCORD_CLIENT_SECRET should be set via wrangler secrets, not plain vars.

[[d1_databases]]
binding = "DB"
database_name = "ttrpg-activity-db"
database_id = "8cef44a0-b184-45b2-af0b-820d803b2fc0"
migrations_dir = "./migrations"

[[durable_objects.bindings]]
name = "GAME_TABLE"
class_name = "GameTable"

[exports.GameTable]
type = "durable-object"
storage = "sqlite"

# Prunes expired rows from sessions_auth once an hour.
[triggers]
crons = ["0 * * * *"]
