name = "tetherscord"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Deploying the Worker separately from Pages.

[observability.logs]
enabled = true
invocation_logs = true


[vars]
DISCORD_REDIRECT_URI = "https://tetherscord.tkshillinz.workers.dev/api/oauth/discord/exchange"
DISCORD_CLIENT_ID = "1540421919982231692"

# DISCORD_CLIENT_SECRET should be set via wrangler secrets, not plain vars.

[[d1_databases]]
binding = "DB"
database_name = "ttrpg-activity-db"
database_id = "8cef44a0-b184-45b2-af0b-820d803b2fc0"
migrations_dir = "./migratons"

[[durable_objects.bindings]]
name = "GAME_TABLE"
class_name = "GameTable"

[exports.GameTable]
type = "durable-object"
storage = "sqlite"

[build]
command = "npm run build" # or "npx esbuild src/index.ts --bundle --outfile=dist/index.js"
